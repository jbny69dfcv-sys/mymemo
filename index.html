<!-- コメント詳細ページ -->
<div id="postDetailPage">
    <!-- 上部固定ヘッダー -->
    <div class="detail-header">
        <button id="backFromDetailButton">← 戻る</button>
    </div>

    <!-- 中身（スクロールする領域） -->
    <div class="detail-scroll-area">
        <div id="detailPostArea"></div>
        <div id="detailComments"></div>
    </div>

    <!-- 下部固定コメント入力欄 -->
    <div class="detail-comment-input-area">
        <input type="text" id="commentInput" placeholder="コメントを入力...">
        <button id="sendCommentButton">送信</button>
    </div>
</div>
